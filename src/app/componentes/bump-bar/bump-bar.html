<div class="BumpBar">
  <button
    class="bump"
    (click)="bump()"
    [disabled]="srvNavegacion.seleccion === undefined"
  >
    <span>Bump</span>
  </button>

  <button
    class="boton"
    (click)="srvNavegacion.anteriorPagina()"
    [disabled]="srvNavegacion.paginaActual() === 0"
  >
    <img src="imagenes/Anterior_Pagina.png" alt="Nota" />
  </button>

  <button class="boton" (click)="srvNavegacion.anteriorComanda()">
    <img src="imagenes/Anterior_Columna.png" alt="Nota" />
  </button>

  <button class="boton" (click)="srvNavegacion.siguienteComanda()">
    <img src="imagenes/Siguiente_Columna.png" alt="Nota" />
  </button>

  <button
    class="boton"
    (click)="srvNavegacion.siguientePagina()"
    [disabled]="srvNavegacion.paginaActual() >= srvNavegacion.totalPaginas() - 1"
  >
    <img src="imagenes/Siguiente_Pagina.png" alt="Nota" />
  </button>

  <button class="boton" (click)="abrirConfiguracion()">
    <img src="imagenes/config.png" alt="Nota" />
  </button>
</div>
