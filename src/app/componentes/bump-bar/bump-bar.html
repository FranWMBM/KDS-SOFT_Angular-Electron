  <button class="boton">
    <span>Bump</span>
  </button>

  <button class="boton" (click)="srvComandas.comandaAnterior()">
    <img src="imagenes/Anterior_Columna.png" alt="Nota" />
  </button>

  <button class="boton" (click)="srvComandas.comandaSiguiente()">
    <img src="imagenes/Siguiente_Columna.png" alt="Nota" />
  </button>

  <button
    class="boton"
    (click)="srvComandas.paginaAnterior()"
    [disabled]="srvComandas.paginaActual() === 0"
  >
    <img src="imagenes/Anterior_Pagina.png" alt="Nota" />
  </button>

  <button
    class="boton"
    (click)="srvComandas.siguientePagina()"
    [disabled]="srvComandas.paginaActual() >= srvComandas.totalPaginas() - 1"
  >
    <img src="imagenes/Siguiente_Pagina.png" alt="Nota" />
  </button>
</div>
