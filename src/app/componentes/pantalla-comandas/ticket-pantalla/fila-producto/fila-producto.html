<div>
  @if (datos()?.tipo === 'principal') {
    <div class="separador"></div>
  }
  <div
    [ngClass]="{
      'principal': datos()?.tipo === 'principal',
      'comentario': datos()?.tipo === 'comentario'
    }"
  >
    <!-- {{ datos()?.movimiento }} - {{ datos()?.descripcion }} -->
    {{ datos()?.descripcion }}
  </div>
</div>
